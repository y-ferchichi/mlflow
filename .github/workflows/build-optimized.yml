name: Build Optimized MLflow Image

on:
  push:
    branches: [fix/high-metric-count-ui-performance]
    paths:
      - "mlflow/server/js/src/**"
      - "Dockerfile.optimized"
      - ".github/workflows/build-optimized.yml"
  workflow_dispatch:
    inputs:
      mlflow_version:
        description: "MLflow version to base on"
        required: false
        default: "2.21.3"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ inputs.mlflow_version || '2.21.3' }}-optimized
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.optimized
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MLFLOW_VERSION=${{ inputs.mlflow_version || '2.21.3' }}
